<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 0.8rem;
      user-select: none;

      background-size: cover;
      touch-action: manipulation;
    }

    #loginScreen {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border-radius: 2.8rem;
      padding: 2.8rem 2rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.08), 0 0 0 1px rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.12);
      position: relative;
      overflow: hidden;
    }
    .login-content { position: relative; z-index: 2; }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-header p { color: #5a6a8a; font-size: 0.9rem; margin-top: 0.3rem; }
    .login-form { display: flex; flex-direction: column; gap: 1.2rem; }
    .login-form .input-group { position: relative; }

      top: 50%;

    }
    .login-form input {

      padding: 0.9rem 1rem 0.9rem 3rem;
      background: #f5f0eb;
      border: 1px solid rgba(26,42,74,0.08);
      border-radius: 60px;
      color: #1a2a4a;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .login-form input:focus {
      border-color: rgba(212,175,55,0.2);
      background: #fff;
    }
    .login-form .login-btn {
      padding: 0.9rem;
      background: #1a2a4a;
      border: none;
      border-radius: 60px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .login-form .login-btn:hover { transform: scale(1.02); }
    .login-form .login-btn:active { transform: scale(0.95); }
    .login-error {

      font-size: 0.8rem;
      text-align: center;

    }
    .login-error.show { opacity: 1; }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.6rem;
      color: #9aabbf;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .login-footer i { color: #d4af37; margin-right: 4px; }

    #welcomeOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }
    #welcomeOverlay.show { display: flex; }
    .welcome-card {
      text-align: center;
      padding: 3rem 2.5rem;
      background: #fff;
      border-radius: 3rem;
      border: 1px solid rgba(212,175,55,0.08);
      box-shadow: 0 40px 80px rgba(0,0,0,0.04);
      max-width: 500px;
      width: 90%;
    }
    .welcome-card .welcome-icon { font-size: 4rem; color: #d4af37; display: block; margin-bottom: 1rem; }
    .welcome-card h2 { font-size: 1.8rem; color: #1a2a4a; margin-bottom: 0.5rem; }
    .welcome-card p { color: #5a6a8a; font-size: 1rem; margin-bottom: 1.5rem; }
    .welcome-card .continue-btn {
      padding: 0.8rem 2.5rem;
      background: #1a2a4a;
      border: none;
      border-radius: 60px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .welcome-card .continue-btn:hover { transform: scale(1.03); }
    .welcome-card .continue-btn:active { transform: scale(0.95); }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    #radioPage {
      display: none;
      max-width: 820px;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }
    #radioPage.show { display: block; }
    .santoria-panel {
      width: 100%;
      background: rgba(255,255,255,0.85);
      background-image: url('https://i.postimg.cc/66rWZyVK/new-logo.png');
      background-size: 80%;
      background-position: center bottom 30px;
      background-repeat: no-repeat;
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border-radius: 3.2rem;
      padding: 1.8rem 1.6rem 2rem;
      box-shadow: 0 40px 80px rgba(0,0,0,0.04), 0 0 0 1px rgba(212,175,55,0.06);
      border: 1px solid rgba(212,175,55,0.06);
      position: relative;
      overflow: hidden;
    }
    .santoria-panel::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 70% 30%, rgba(212,175,55,0.02), transparent 50%);
      pointer-events: none;
    }
    .santoria-content { position: relative; z-index: 2; }

    .santoria-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(26,42,74,0.04);
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .santoria-header .brand {
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #1a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .santoria-header .brand i { color: #d4af37; }
    .santoria-header .user-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #f5f0eb;
      padding: 0.3rem 1rem;
      border-radius: 60px;
    }
    .santoria-header .user-info i { color: #d4af37; font-size: 0.8rem; }
    .santoria-header .user-info .username-display {
      color: #1a2a4a;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .santoria-header .status-badge {
      background: #f5f0eb;
      padding: 0.3rem 1rem;
      border-radius: 60px;
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #d4af37;
      border: 1px solid rgba(212,175,55,0.04);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .santoria-header .status-badge i { font-size: 0.4rem; color: #d4af37; }

    .track-area {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .cover-art {
      width: 80px;
      height: 80px;
      min-width: 80px;
      background: #f5f0eb;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: #d4af37;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.02);
    }
    .cover-art i { filter: drop-shadow(0 8px 20px rgba(212,175,55,0.04)); }
    .track-info { flex: 1; min-width: 0; }
    .track-info .track-name {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a2a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name {
      font-size: 0.85rem;
      color: #5a6a8a;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name i { font-size: 0.4rem; color: #d4af37; }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 44px;
      margin: 0.4rem 0 1.2rem;
      background: #f5f0eb;
      border-radius: 60px;
      padding: 0.3rem 1.5rem;
      border: 1px solid rgba(212,175,55,0.02);
    }
    .visualizer .bar {
      width: 5px;
      height: 16px;
      background: linear-gradient(to top, #d4af37, #f5d97a);
      border-radius: 10px;
      animation: pulseBar 1.1s infinite alternate ease-in-out;
      transform-origin: bottom;
      opacity: 0.6;
    }
    .visualizer .bar:nth-child(1) { animation-duration: 0.9s; height: 18px; }
    .visualizer .bar:nth-child(2) { animation-duration: 1.3s; height: 30px; }
    .visualizer .bar:nth-child(3) { animation-duration: 0.7s; height: 22px; }
    .visualizer .bar:nth-child(4) { animation-duration: 1.5s; height: 36px; }
    .visualizer .bar:nth-child(5) { animation-duration: 1.0s; height: 26px; }
    .visualizer .bar:nth-child(6) { animation-duration: 1.8s; height: 40px; }
    .visualizer .bar:nth-child(7) { animation-duration: 0.8s; height: 18px; }
    .visualizer .bar:nth-child(8) { animation-duration: 1.2s; height: 32px; }
    .visualizer .bar:nth-child(9) { animation-duration: 1.0s; height: 22px; }
    .visualizer .bar:nth-child(10) { animation-duration: 1.4s; height: 36px; }
    @keyframes pulseBar {
      0% { transform: scaleY(0.2); opacity: 0.3; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0.8rem 0 0.3rem;
      padding: 0.2rem 0;
    }
    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(26,42,74,0.08);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      touch-action: none;
      transition: height 0.1s;
    }
    .progress-bar:hover,
    .progress-bar:active {
      height: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #d4af37, #f5d97a);
      border-radius: 10px;
      transition: width 0.05s linear;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #f5d97a, #d4af37);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .progress-bar:hover .progress-fill::after,
    .progress-bar:active .progress-fill::after {
      opacity: 1;
    }
    .time-display {
      font-size: 0.7rem;
      color: #5a6a8a;
      font-weight: 500;
      min-width: 55px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin: 1.4rem 0 0.2rem;
    }
    .controls button {
      background: #f5f0eb;
      border: 1px solid rgba(26,42,74,0.02);
      color: #1a2a4a;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .controls button:hover { background: #fff; border-color: rgba(212,175,55,0.04); transform: translateY(-1px); }
    .controls button:active { transform: scale(0.88); }
    .controls button.play-btn {
      background: #1a2a4a;
      border-color: rgba(26,42,74,0.04);
      color: #fff;
      width: 68px;
      height: 68px;
      font-size: 1.8rem;
      box-shadow: 0 4px 20px rgba(26,42,74,0.08);
    }
    .controls button.play-btn:hover { transform: scale(1.03); box-shadow: 0 6px 30px rgba(26,42,74,0.12); }
    .controls button.play-btn:active { transform: scale(0.88); }

    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.8rem;
      padding: 0.3rem 1rem;
      background: #f5f0eb;
      border-radius: 60px;
      border: 1px solid rgba(26,42,74,0.02);
    }
    .volume-container i { color: #9aabbf; font-size: 0.8rem; pointer-events: none; }
    .volume-container input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(26,42,74,0.04);
      border-radius: 10px;
      outline: none;
    }
    .volume-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5d97a, #d4af37);
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.02);
    }
    .volume-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d4af37;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.02);
    }
    .volume-container #muteBtn {
      background: none;
      border: none;
      color: #9aabbf;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      transition: 0.2s;
    }
    .volume-container #muteBtn:hover { color: #d4af37; }
    .volume-container #muteBtn:active { transform: scale(0.85); }

    .santoria-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.5rem;
      letter-spacing: 1.2px;
      color: #9aabbf;
      border-top: 1px solid rgba(26,42,74,0.02);
      padding-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      text-transform: uppercase;
      flex-wrap: wrap;
    }
    .santoria-footer span i { margin-right: 4px; color: #d4af37; }
    audio { display: none !important; }

    @media (min-width: 600px) {
      .santoria-panel { padding: 2.8rem 2.6rem; border-radius: 4.2rem; }
      .cover-art { width: 120px; height: 120px; min-width: 120px; font-size: 3.6rem; }
      .track-info .track-name { font-size: 2.2rem; white-space: normal; }
      .track-info .artist-name { font-size: 1rem; white-space: normal; }
      .controls button { width: 58px; height: 58px; font-size: 1.4rem; }
      .controls button.play-btn { width: 78px; height: 78px; font-size: 2.2rem; }
      .volume-container input[type="range"] { width: 140px; }
      .santoria-header .brand { font-size: 1.6rem; }
      .visualizer { height: 56px; gap: 6px; }
      .visualizer .bar { width: 6px; }
      .time-display { font-size: 0.8rem; min-width: 65px; }
    }
    @media (max-width: 400px) {
      .controls button { width: 40px; height: 40px; font-size: 1rem; }
      .controls button.play-btn { width: 58px; height: 58px; font-size: 1.5rem; }
      .cover-art { width: 60px; height: 60px; min-width: 60px; font-size: 1.8rem; }
      .track-info .track-name { font-size: 1.1rem; }
      .volume-container input[type="range"] { width: 70px; }
      .santoria-panel { padding: 1.2rem 1rem; border-radius: 2.4rem; }
      .time-display { font-size: 0.6rem; min-width: 45px; }
    }
  </style>
</head>

      ];

      // ===== DOM =====
      const loginScreen = document.getElementById('loginScreen');
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginError = document.getElementById('loginError');
      const welcomeOverlay = document.getElementById('welcomeOverlay');
      const welcomeTitle = document.getElementById('welcomeTitle');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const continueBtn = document.getElementById('continueBtn');
      const radioPage = document.getElementById('radioPage');
      const displayUsername = document.getElementById('displayUsername');
      const audio = document.getElementById('santoriaAudio');
      const playBtn = document.getElementById('playBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volumeSlider = document.getElementById('volumeSlider');
      const progressFill = document.getElementById('progressFill');
      const progressBar = document.getElementById('progressBar');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const trackNameEl = document.getElementById('trackName');
      const artistNameEl = document.getElementById('artistName');
      const statusBadge = document.getElementById('statusBadge');

      // ===== PLAYLIST =====
      const playlist = [
        { src: "https://files.catbox.moe/zlf4uh.mp3", name: "سورة البقرة", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/ozwroe.mp3", name: "Morning Vibes", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/30wghp.mp3", name: "Giorgio Armani", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/gwq0wf.mp3", name: "Gucci", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/8y6yh7.mp3", name: "Hugo Boss", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/0qftm3.mp3", name: "Prada", artist: "Santoria studio" },
        { src: "https://files.catbox.moe/cs7u9k.mp3", name: "Chanel", artist: "Santoria studio" }
      ];

      // ===== STATE =====
      let currentTrackIndex = 0;
      let isPlaying = false;
      let currentUser = null;
      let firstRun = true;
      let isEnded = false;
      let isDragging = false;
      let audioReady = false;
      let loginTimestamp = null;
      let logoutTracked = false;

      // ==========================================================
      // EMAIL NOTIFICATION
      // ==========================================================
      function sendLoginNotification(user) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

        const templateParams = {
          username: user.username,
          welcome: user.welcome,
          date: dateStr,
          time: timeStr
        };

        emailjs.send(EMAILJS_CONFIG.serviceID, EMAILJS_CONFIG.templateID, templateParams)
          .then(function(response) {
            console.log('✅ Email notification sent successfully!', response);
          }, function(error) {
            console.log('❌ Failed to send email notification:', error);
          });
      }

      // ==========================================================
      // GOOGLE SHEETS TRACKING
      // ==========================================================
      function trackLogin(user) {
        const now = new Date();
        loginTimestamp = now;
        const data = {
          username: user.username,
          date: now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          day: now.toLocaleDateString('en-US', { weekday: 'long' }),
          action: 'LOGIN',
          duration: '',
          timestamp: now.toISOString()
        };
        sendToSheets(data);
        console.log('📊 LOGIN tracked:', data);
      }

      function trackLogout(user) {
        const now = new Date();
        let duration = '';
        if (loginTimestamp) {
          const diffMs = now - loginTimestamp;
          const diffMin = Math.floor(diffMs / 60000);
          duration = diffMin + ' minutes';
        }
        const data = {
          username: user.username,
          date: now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          day: now.toLocaleDateString('en-US', { weekday: 'long' }),
          action: 'LOGOUT',
          duration: duration,
          timestamp: now.toISOString()
        };
        sendToSheets(data);
        console.log('📊 LOGOUT tracked:', data);
      }

      function sendToSheets(data) {
        if (!GOOGLE_SHEETS_WEBAPP_URL || GOOGLE_SHEETS_WEBAPP_URL === 'https://script.google.com/macros/s/AKfycbz1TL7_6TkuTpSuxOGXQp5yrWC1Fqx6PF0bo_yzOKEIQJwCQeIdDbXztw5e7fyWxx6g/exec') {
          console.log('⚠️ Google Sheets URL not set!');
          return;
        }
        fetch(GOOGLE_SHEETS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).catch(error => {
          console.log('📊 Tracking error:', error);
        });
      }

      // ===== BEFOREUNLOAD (LOGOUT TRACK) =====
      window.addEventListener('beforeunload', function() {
        if (currentUser && !logoutTracked) {
          logoutTracked = true;
          const now = new Date();
          let duration = '';
          if (loginTimestamp) {
            const diffMs = now - loginTimestamp;
            const diffMin = Math.floor(diffMs / 60000);
            duration = diffMin + ' minutes';
          }
          const data = {
            username: currentUser.username,
            date: now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),
            time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
            day: now.toLocaleDateString('en-US', { weekday: 'long' }),
            action: 'LOGOUT',
            duration: duration,
            timestamp: now.toISOString()
          };
          if (navigator.sendBeacon && GOOGLE_SHEETS_WEBAPP_URL && GOOGLE_SHEETS_WEBAPP_URL !== 'https://script.google.com/macros/s/AKfycbz1TL7_6TkuTpSuxOGXQp5yrWC1Fqx6PF0bo_yzOKEIQJwCQeIdDbXztw5e7fyWxx6g/exec') {
            navigator.sendBeacon(GOOGLE_SHEETS_WEBAPP_URL, JSON.stringify(data));
          } else {
            sendToSheets(data);
          }
          console.log('📊 LOGOUT tracked (page close):', data);
        }
      });

      // ===== LOGIN =====
      function handleLogin(e) {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const user = users.find(u => u.username === username && u.password === password);
        if (user) {
          currentUser = user;
          logoutTracked = false;
          loginError.classList.remove('show');
          welcomeTitle.textContent = 'Welcome!';
          welcomeMessage.textContent = user.welcome;
          welcomeOverlay.classList.add('show');
          loginScreen.style.display = 'none';

          // 📧 Send email notification
          sendLoginNotification(user);

          // 📊 Track login in Google Sheets
          trackLogin(user);
        } else {
          loginError.textContent = 'Invalid username or password';
          loginError.classList.add('show');
          setTimeout(() => loginError.classList.remove('show'), 3000);
        }
      }
      loginForm.addEventListener('submit', handleLogin);

      // ===== CONTINUE =====
      continueBtn.addEventListener('click', function() {
        welcomeOverlay.classList.remove('show');
        radioPage.classList.add('show');
        if (currentUser) displayUsername.textContent = currentUser.username;

        firstRun = true;
        currentTrackIndex = 0;
        isEnded = false;
        audioReady = false;

        loadTrack(0);
        setVolume(0.8);

        function tryPlay() {
          if (audio.readyState >= 2) {
            audio.play().then(() => {
              isPlaying = true;
              playBtn.innerHTML = '<i class="fas fa-pause"></i>';
              playBtn.style.color = '#ffffff';
            }).catch(() => {});
          } else {
            audio.addEventListener('canplay', function onCanPlay() {
              audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playBtn.style.color = '#ffffff';
              }).catch(() => {});
              audio.removeEventListener('canplay', onCanPlay);
            });
          }
        }
        setTimeout(tryPlay, 100);
      });

      // ===== LOAD TRACK =====
      function loadTrack(index) {
        if (index >= playlist.length) index = 0;
        if (index < 0) index = playlist.length - 1;

        currentTrackIndex = index;
        const track = playlist[index];
        if (!track) return;

        trackNameEl.textContent = track.name;
        artistNameEl.textContent = track.artist;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
        audioReady = false;
        updateStatusBadge();

        audio.src = track.src;
        audio.load();

        audio.addEventListener('loadedmetadata', function onMeta() {
          if (audio.duration > 0) {
            totalTimeEl.textContent = formatTime(audio.duration);
            audioReady = true;
          }
          audio.removeEventListener('loadedmetadata', onMeta);
        });

        audio.addEventListener('canplay', function onCanPlay() {
          if (audio.duration > 0) {
            totalTimeEl.textContent = formatTime(audio.duration);
            audioReady = true;
          }
          audio.removeEventListener('canplay', onCanPlay);
        });

        updateStatusBadge();
      }

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      function updateStatusBadge() {
        const track = playlist[currentTrackIndex];
        if (track) {
          statusBadge.innerHTML = `<i class="fas fa-circle"></i> ${track.name} · radio`;
        }
      }

      // ===== TOGGLE PLAY =====
      function togglePlay() {
        if (playlist.length === 0) return;

        if (audio.paused) {
          if (audio.ended) {
            if (firstRun) {
              currentTrackIndex = 1;
              firstRun = false;
            } else {
              let next = currentTrackIndex + 1;
              if (next >= playlist.length) next = 1;
              currentTrackIndex = next;
            }
            loadTrack(currentTrackIndex);
            setTimeout(() => {
              audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playBtn.style.color = '#ffffff';
              }).catch(() => {});
            }, 100);
            return;
          }

          audio.play().then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.style.color = '#ffffff';
          }).catch(() => {});
        } else {
          audio.pause();
          isPlaying = false;
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.style.color = '#ffffff';
        }
      }

      function setVolume(value) {
        audio.volume = parseFloat(value);
        volumeSlider.value = value;
        updateMuteIcon();
      }

      function updateMuteIcon() {
        const vol = audio.volume;
        const muted = audio.muted;
        if (muted || vol === 0) muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        else if (vol < 0.5) muteBtn.innerHTML = '<i class="fas fa-volume-low"></i>';
        else muteBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateMuteIcon();
      }

      // ===== PROGRESS UPDATE =====
      function updateProgress() {
        if (isDragging) return;
        if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
          if (totalTimeEl.textContent === '0:00') {
            totalTimeEl.textContent = formatTime(audio.duration);
          }
        }
      }

      // ===== SEEKING - 100% RELIABLE =====
      function seekTo(clientX) {
        const rect = progressBar.getBoundingClientRect();
        let x = (clientX - rect.left) / rect.width;
        x = Math.max(0, Math.min(1, x));

        if (audio.duration && audio.duration > 0 && !isNaN(audio.duration)) {
          try {
            const newTime = x * audio.duration;
            if (newTime >= 0 && newTime <= audio.duration) {
              audio.currentTime = newTime;
              progressFill.style.width = (x * 100) + '%';
              currentTimeEl.textContent = formatTime(newTime);
              return true;
            }
          } catch (e) {
            return false;
          }
        }
        return false;
      }

      function handleSeekStart(e) {
        e.preventDefault();
        e.stopPropagation();
        isDragging = true;

        let clientX;
        if (e.type === 'mousedown') clientX = e.clientX;
        else if (e.type === 'touchstart') clientX = e.touches[0].clientX;
        else return;
        seekTo(clientX);
      }

      function handleSeekMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();

        let clientX;
        if (e.type === 'mousemove') clientX = e.clientX;
        else if (e.type === 'touchmove') clientX = e.touches[0].clientX;
        else return;
        seekTo(clientX);
      }

      function handleSeekEnd(e) {
        if (!isDragging) return;
        isDragging = false;

        let clientX;
        if (e.type === 'mouseup') clientX = e.clientX;
        else if (e.type === 'touchend') clientX = e.changedTouches[0].clientX;
        else return;
        seekTo(clientX);

        if (isPlaying && audio.paused) {
          audio.play().catch(() => {});
        }
      }

      // ===== EVENT LISTENERS =====
      playBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        togglePlay();
      });

      playBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        e.stopPropagation();
        togglePlay();
      }, { passive: false });

      muteBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleMute();
      });

      volumeSlider.addEventListener('input', function(e) {
        e.stopPropagation();
        setVolume(e.target.value);
      });

      progressBar.addEventListener('mousedown', handleSeekStart);
      progressBar.addEventListener('touchstart', handleSeekStart, { passive: false });

      document.addEventListener('mousemove', handleSeekMove);
      document.addEventListener('mouseup', handleSeekEnd);
      document.addEventListener('touchmove', handleSeekMove, { passive: false });
      document.addEventListener('touchend', handleSeekEnd, { passive: false });

      audio.addEventListener('timeupdate', updateProgress);

      // ===== ENDED =====
      audio.addEventListener('ended', function() {
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        playBtn.style.color = '#ffffff';

        if (firstRun) {
          currentTrackIndex = 1;
          firstRun = false;
        } else {
          let next = currentTrackIndex + 1;
          if (next >= playlist.length) next = 1;
          currentTrackIndex = next;
        }

        loadTrack(currentTrackIndex);

        setTimeout(() => {
          audio.play().then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.style.color = '#ffffff';
          }).catch(() => {});
        }, 100);
      });

      // ===== KEYBOARD =====
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);

      document.addEventListener('keydown', function(e) {
        if (!radioPage.classList.contains('show')) return;
        if (e.key === ' ' || e.key === 'Space' || e.key === 'MediaPlayPause') {
          e.preventDefault();
          e.stopPropagation();
          togglePlay();
          return false;
        }
      }, true);

      // ===== INIT =====
      if (playlist.length > 0) {
        loadTrack(0);
        setVolume(0.8);
      }

      console.log('⚡ Santoria · 100% WORKING + TRACKING');
      console.log('✅ Progress bar works on ALL songs');
      console.log('✅ Audio never stops when seeking');
      console.log('📧 Email notification on login');
      console.log('📊 Google Sheets tracking (login + logout)');
      console.log('⌨️  Space = Play/Pause');
    })();
  </script>
